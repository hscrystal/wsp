name: Build & Deploy (dev)

# push เข้า main ที่แก้ app/ -> build image -> อัปเดต values-dev.yaml -> ArgoCD sync อัตโนมัติ
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "charts/hello-app/**"
  workflow_dispatch: {}   # กดรันมือจากแท็บ Actions ได้ (ไม่ต้องรอ push)

permissions:
  contents: write   # ต้องเขียนกลับเข้า repo (commit values-dev.yaml)

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image (local, ยังไม่ push)
        uses: docker/build-push-action@v5
        with:
          context: app
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev-${{ steps.vars.outputs.sha_short }}

      - name: Save image เป็น tarball
        run: |
          docker save ${{ env.IMAGE_NAME }}:dev-${{ steps.vars.outputs.sha_short }} \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-dev-${{ steps.vars.outputs.sha_short }}
          path: image.tar
          retention-days: 1

  scan-image:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-dev-${{ needs.build-image.outputs.image_tag }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: สแกนช่องโหว่ด้วย Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dev-${{ needs.build-image.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"     # เจอช่องโหว่ระดับ CRITICAL/HIGH -> fail job ทันที ไม่ไปต่อ

  push-image:
    needs: [build-image, scan-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-dev-${{ needs.build-image.outputs.image_tag }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (ผ่านสแกนแล้วเท่านั้น)
        run: docker push ${{ env.IMAGE_NAME }}:dev-${{ needs.build-image.outputs.image_tag }}

  update-dev-values:
    needs: [build-image, push-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump image.tag ใน values-dev.yaml
        run: |
          sed -i "s|tag: \".*\"|tag: \"dev-${{ needs.build-image.outputs.image_tag }}\"|" \
            charts/hello-app/values-dev.yaml

      - name: Bump ingress.host ใน values-dev.yaml (จาก GitHub Actions Variable)
        if: vars.INGRESS_HOST_DEV != ''
        run: |
          sed -i "s|host: .*|host: ${{ vars.INGRESS_HOST_DEV }}|" \
            charts/hello-app/values-dev.yaml

      - name: Bump externalDns.target ใน values.yaml (จาก GitHub Actions Variable)
        if: vars.CLOUDFLARE_TUNNEL_TARGET != ''
        run: |
          sed -i "s|target: .*|target: \"${{ vars.CLOUDFLARE_TUNNEL_TARGET }}\"|" \
            charts/hello-app/values.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/hello-app/values-dev.yaml charts/hello-app/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(dev): bump image tag to dev-${{ needs.build-image.outputs.image_tag }} [skip ci]"
          git push
