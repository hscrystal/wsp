name: Build & Deploy (dev)

# push เข้า main ที่แก้ app/ -> build image -> อัปเดต values-dev.yaml -> ArgoCD sync อัตโนมัติ
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "charts/hello-app/**"
  workflow_dispatch: {}   # กดรันมือจากแท็บ Actions ได้ (ไม่ต้องรอ push)

permissions:
  contents: write   # ต้องเขียนกลับเข้า repo (commit values-dev.yaml)

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app

jobs:
  build-image:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image (local, ยังไม่ push)
        uses: docker/build-push-action@v7
        with:
          context: app
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev-${{ steps.vars.outputs.sha_short }}

      - name: Save image เป็น tarball
        run: |
          docker save ${{ env.IMAGE_NAME }}:dev-${{ steps.vars.outputs.sha_short }} \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-dev-${{ steps.vars.outputs.sha_short }}
          path: image.tar
          retention-days: 1

  scan-image:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-dev-${{ needs.build-image.outputs.image_tag }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: สแกนช่องโหว่ด้วย Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dev-${{ needs.build-image.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"     # เจอช่องโหว่ระดับ CRITICAL/HIGH -> fail job ทันที ไม่ไปต่อ

  push-image:
    needs: [build-image, scan-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-dev-${{ needs.build-image.outputs.image_tag }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (ผ่านสแกนแล้วเท่านั้น)
        run: docker push ${{ env.IMAGE_NAME }}:dev-${{ needs.build-image.outputs.image_tag }}

  update-dev-values:
    needs: [build-image, push-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump image.tag ใน values-dev.yaml แล้ว commit กลับ
        env:
          NEW_TAG: dev-${{ needs.build-image.outputs.image_tag }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ทุกรอบเริ่มจาก reset ไป origin/main ล่าสุดก่อนแก้ค่า แล้วค่อย commit ใหม่
          # ถ้ามี commit อื่นแทรกเข้า main ระหว่าง job นี้รัน push จะถูกปฏิเสธแล้ววนลองใหม่
          # (ไม่ใช้ rebase เพราะ reset+แก้ใหม่ไม่มีทางเกิด conflict ให้ค้าง)
          for attempt in 1 2 3 4 5; do
            git fetch origin main || exit 1
            git reset --hard FETCH_HEAD || exit 1

            sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|" charts/hello-app/values-dev.yaml

            # กัน sed แก้ไม่ติด (ไฟล์เปลี่ยนรูปแบบ/path ย้าย) แล้ว job รายงานสำเร็จแบบเงียบๆ
            if ! grep -q "tag: \"$NEW_TAG\"" charts/hello-app/values-dev.yaml; then
              echo "::error::แก้ image.tag ไม่สำเร็จ — ไม่พบ tag: \"$NEW_TAG\" ใน values-dev.yaml หลังรัน sed"
              exit 1
            fi

            git add charts/hello-app/values-dev.yaml
            if git diff --cached --quiet; then
              echo "values-dev.yaml ชี้ $NEW_TAG อยู่แล้ว — ไม่ต้อง commit"
              exit 0
            fi

            git commit -m "chore(dev): bump image tag to $NEW_TAG [skip ci]" || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push ครั้งที่ $attempt ถูกปฏิเสธ (น่าจะมี commit ใหม่เข้า main) — ลองใหม่"
            sleep $((attempt * 3))
          done

          echo "::error::push ไม่สำเร็จหลังลอง 5 ครั้ง — image $NEW_TAG ขึ้น Docker Hub แล้วแต่ values-dev.yaml ยังไม่ถูก bump (ArgoCD จะยังไม่ deploy)"
          exit 1
