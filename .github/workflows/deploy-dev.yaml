name: Build & Deploy (dev)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "charts/hello-app/**"

permissions:
  contents: write  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (local, ยังไม่ push)
        uses: docker/build-push-action@v5
        with:
          context: app
          push: false
          load: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app:dev-${{ steps.vars.outputs.sha_short }}

      - name: สแกนช่องโหว่ด้วย Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app:dev-${{ steps.vars.outputs.sha_short }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"     # เจอช่องโหว่ระดับ CRITICAL/HIGH -> fail job ทันที ไม่ไปต่อ

      - name: Push image (ผ่านสแกนแล้วเท่านั้น)
        run: docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app:dev-${{ steps.vars.outputs.sha_short }}

  update-dev-values:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump image.tag ใน values-dev.yaml
        run: |
          sed -i "s|tag: \".*\"|tag: \"dev-${{ needs.build-and-push.outputs.image_tag }}\"|" \
            charts/hello-app/values-dev.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/hello-app/values-dev.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(dev): bump image tag to dev-${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push
