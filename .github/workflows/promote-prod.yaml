name: Build & Promote (prod)

# trigger เฉพาะตอนสร้าง git tag รูปแบบ v* เช่น v1.2.0
# แยกจาก dev เพราะ prod ไม่ควร deploy อัตโนมัติทุก commit
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:      # กดรันมือจากแท็บ Actions ได้ ต้องระบุ version เอง (push ด้วย tag ไม่มี input นี้)
    inputs:
      version:
        description: "Version tag เช่น v1.2.3 (ใช้แทน git tag ตอนกดรันมือ)"
        required: true

permissions:
  contents: write

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image (local, ยังไม่ push)
        uses: docker/build-push-action@v7
        with:
          context: app
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Save image เป็น tarball
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ env.VERSION }}
          path: image.tar
          retention-days: 1

  scan-image:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-${{ env.VERSION }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: สแกนช่องโหว่ด้วย Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"     # prod เข้มกว่า dev: เจอช่องโหว่แล้วห้ามโปรโมทเด็ดขาด

  push-image:
    needs: [build-image, scan-image]
    runs-on: ubuntu-24.04
    # ด่านอนุมัติก่อนขึ้น prod: environment "production" ตั้ง required reviewer ไว้ใน repo Settings
    # job นี้จะหยุดรอจนมีคนกด Approve — ยังไม่ push image และ update-prod-values (needs job นี้) ก็ยังไม่รัน
    environment: production
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image-${{ env.VERSION }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (ผ่านสแกนแล้วเท่านั้น)
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

  update-prod-values:
    needs: push-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump image.tag ใน values-prod.yaml แล้ว commit กลับ
        env:
          NEW_TAG: ${{ env.VERSION }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ทุกรอบเริ่มจาก reset ไป origin/main ล่าสุดก่อนแก้ค่า แล้วค่อย commit ใหม่
          # ถ้ามี commit อื่นแทรกเข้า main ระหว่าง job นี้รัน push จะถูกปฏิเสธแล้ววนลองใหม่
          # (ไม่ใช้ rebase เพราะ reset+แก้ใหม่ไม่มีทางเกิด conflict ให้ค้าง)
          for attempt in 1 2 3 4 5; do
            git fetch origin main || exit 1
            git reset --hard FETCH_HEAD || exit 1

            # แก้เฉพาะ tag ที่อยู่ใต้ block image: เท่านั้น (ตั้งแต่บรรทัด image: ถึง key ระดับบนสุดตัวถัดไป)
            # key ชื่อ tag: ใน block อื่นจะไม่ถูกแตะ
            sed -i "/^image:/,/^[^ #]/ s|^  tag: .*|  tag: \"$NEW_TAG\"|" charts/hello-app/values-prod.yaml

            # กัน sed แก้ไม่ติด (ไฟล์เปลี่ยนรูปแบบ/path ย้าย) แล้ว job รายงานสำเร็จแบบเงียบๆ
            current_tag=$(sed -n '/^image:/,/^[^ #]/ s|^  tag: "\(.*\)"$|\1|p' charts/hello-app/values-prod.yaml)
            if [ "$current_tag" != "$NEW_TAG" ]; then
              echo "::error::แก้ image.tag ไม่สำเร็จ — ไม่พบ tag: \"$NEW_TAG\" ใน values-prod.yaml หลังรัน sed"
              exit 1
            fi

            git add charts/hello-app/values-prod.yaml
            if git diff --cached --quiet; then
              echo "values-prod.yaml ชี้ $NEW_TAG อยู่แล้ว — ไม่ต้อง commit"
              exit 0
            fi

            # ไม่ใส่ [skip ci]: commit ที่ push ด้วย GITHUB_TOKEN ไม่ trigger workflow อยู่แล้ว จึงไม่เกิด loop
            # และถ้าใส่ git tag ที่ชี้มา commit นี้จะไม่ trigger promote-prod
            git commit -m "chore(prod): promote image to $NEW_TAG" || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push ครั้งที่ $attempt ถูกปฏิเสธ (น่าจะมี commit ใหม่เข้า main) — ลองใหม่"
            sleep $((attempt * 3))
          done

          echo "::error::push ไม่สำเร็จหลังลอง 5 ครั้ง — image $NEW_TAG ขึ้น Docker Hub แล้วแต่ values-prod.yaml ยังไม่ถูก bump (ArgoCD จะยังไม่ deploy)"
          exit 1
