name: Build & Promote (prod)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image (tag = git tag)
        uses: docker/build-push-action@v5
        with:
          context: app
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app:${{ github.ref_name }}

  update-prod-values:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump image.tag ใน values-prod.yaml
        run: |
          sed -i "s|tag: \".*\"|tag: \"${{ github.ref_name }}\"|" \
            charts/hello-app/values-prod.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/hello-app/values-prod.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(prod): promote image to ${{ github.ref_name }} [skip ci]"
          git push
