name: Build & Promote (prod)

# trigger เฉพาะตอนสร้าง git tag รูปแบบ v* เช่น v1.2.0
# แยกจาก dev เพราะ prod ไม่ควร deploy อัตโนมัติทุก commit
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hello-app

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (local, ยังไม่ push)
        uses: docker/build-push-action@v5
        with:
          context: app
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Save image เป็น tarball
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.ref_name }}
          path: image.tar
          retention-days: 1

  scan-image:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ github.ref_name }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: สแกนช่องโหว่ด้วย Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"     # prod เข้มกว่า dev: เจอช่องโหว่แล้วห้ามโปรโมทเด็ดขาด

  push-image:
    needs: [build-image, scan-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ github.ref_name }}

      - name: Load image เข้า Docker daemon
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (ผ่านสแกนแล้วเท่านั้น)
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  update-prod-values:
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump image.tag ใน values-prod.yaml
        run: |
          sed -i "s|tag: \".*\"|tag: \"${{ github.ref_name }}\"|" \
            charts/hello-app/values-prod.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/hello-app/values-prod.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(prod): promote image to ${{ github.ref_name }} [skip ci]"
          git push
