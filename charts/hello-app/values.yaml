# ค่า default ของ chart — ทุก environment ใช้ค่าพวกนี้
# เว้นแต่จะถูก override ด้วยไฟล์ values-<env>.yaml

replicaCount: 1

image:
  repository: docker.io/hscrystal/hello-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

env:
  name: "local"   # ชื่อ environment ที่แสดงบนหน้าเว็บ (กำหนดสีของหน้าด้วย)
  message: "Hello from base values"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  host: hello-app.local
  # external-dns + Cloudflare Tunnel — tunnel เดียวกันใช้ร่วมกันทุก environment
  externalDns:
    enabled: false
    cloudflareProxied: true
    target: "14f74df8-fb87-4275-9e2b-4b0412aa773c.cfargotunnel.com"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
