# ค่า default ของ chart — ทุก environment ใช้ค่าพวกนี้
# เว้นแต่จะถูก override ด้วยไฟล์ values-<env>.yaml

replicaCount: 1

image:
  repository: docker.io/hscrystal/hello-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

env:
  message: "Hello from base values"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  host: hello-app.local
  # external-dns + Cloudflare Tunnel — tunnel เดียวกันใช้ร่วมกันทุก environment
  # target นี้จะถูก CI เขียนทับจาก GitHub Actions Variable "CLOUDFLARE_TUNNEL_TARGET"
  # ทุกครั้งที่ deploy-dev.yaml หรือ promote-prod.yaml รัน
  externalDns:
    enabled: false
    cloudflareProxied: true
    target: "placeholder.cfargotunnel.com"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
