apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hello-app.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello-app.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: APP_MESSAGE
              value: {{ .Values.env.message | quote }}
            - name: APP_CREDIT
              value: {{ .Values.env.credit | quote }}
            - name: APP_ENV
              value: {{ .Values.env.name | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
