{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hello-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-app.labels" . | nindent 4 }}
  {{- if .Values.ingress.externalDns.enabled }}
  annotations:
    # Both prefixes on purpose: external-dns >= v0.23 reads only external-dns.kubernetes.io/ unless
    # --enable-legacy-annotation-prefix is set. Drop the alpha ones once every app has migrated.
    {{- range $prefix := list "external-dns.kubernetes.io" "external-dns.alpha.kubernetes.io" }}
    {{ $prefix }}/hostname: {{ $.Values.ingress.host }}
    {{ $prefix }}/cloudflare-proxied: {{ $.Values.ingress.externalDns.cloudflareProxied | quote }}
    {{ $prefix }}/target: {{ $.Values.ingress.externalDns.target }}
    {{- end }}
  {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hello-app.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
