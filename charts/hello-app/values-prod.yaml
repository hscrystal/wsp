# Override เฉพาะค่าที่ต่างจาก values.yaml สำหรับ prod
replicaCount: 3

image:
  tag: "v1.0.0"

env:
  message: "Hello from PRODUCTION"

ingress:
  enabled: true
  # ค่านี้จะถูก CI เขียนทับจาก GitHub Actions Variable "INGRESS_HOST_PROD"
  # ทุกครั้งที่ promote-prod.yaml รัน (ดู .github/workflows/promote-prod.yaml)
  host: hello-app.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
